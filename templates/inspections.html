<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATANGLAWIN - Inspection History</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-mark.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background: #0d0d1a;
      color: #f0f0f0;
    }
    .inspections-container {
      max-width: 1200px;
      margin: 100px auto 40px;
      padding: 0 20px;
    }
    .inspections-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .inspections-header h1 {
      font-size: 1.8rem;
      color: #f0f0f0;
    }
    .inspections-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .inspections-controls input,
    .inspections-controls select {
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      background: #1a1a2e;
      color: #eee;
      font-size: 0.9rem;
    }
    .inspections-controls button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: var(--primary-red, #d21f1f);
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .inspections-controls button:hover {
      background: #a01818;
    }
    .export-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .export-buttons a {
      padding: 8px 16px;
      border-radius: 6px;
      background: #1e1e34;
      color: #4a90d9;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.08);
      transition: background 0.2s ease;
    }
    .export-buttons a:hover {
      background: #2d2d44;
    }
    .inspections-table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1a2e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .inspections-table th,
    .inspections-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.85rem;
    }
    .inspections-table th {
      background: #16162a;
      color: #a0a0b0;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
    .inspections-table td {
      color: #ddd;
    }
    .inspections-table tr:hover td {
      background: rgba(255,255,255,0.03);
    }
    .btn-delete {
      padding: 4px 10px;
      border: none;
      border-radius: 4px;
      background: #d21f1f;
      color: #fff;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .btn-delete:hover {
      background: #a01818;
    }
    .btn-pdf {
      color: #4a90d9;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      margin-right: 8px;
    }
    .btn-pdf:hover {
      text-decoration: underline;
    }
    .notes-cell {
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #a0a0b0;
      font-size: 0.8rem;
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }
    .pagination button {
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      background: #1a1a2e;
      color: #eee;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .pagination button.active {
      background: #d21f1f;
      border-color: #d21f1f;
    }
    .no-data {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 1rem;
    }
    .back-link {
      color: #4a90d9;
      text-decoration: none;
      margin-bottom: 16px;
      display: inline-block;
      transition: color 0.2s ease;
    }
    .back-link:hover {
      color: #6ab0ff;
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <img src="{{ url_for('static', filename='img/logo-mark.svg') }}" alt="Matanglawin logo" class="nav-logo">
        <div class="nav-brand-text">
          <span class="nav-brand-title">MATANGLAWIN</span>
          <span class="nav-brand-tagline">SEE CRACKS. SAVE LIVES.</span>
        </div>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/inspections" class="nav-link active">Inspections</a>
      </div>
    </div>
  </nav>

  <div class="inspections-container">
    <a href="/" class="back-link">&larr; Back to Dashboard</a>

    <div class="inspections-header">
      <h1>Inspection History</h1>
      <div class="inspections-controls">
        <input type="text" id="searchInput" placeholder="Search by ID or date...">
        <input type="date" id="dateFrom" title="From date">
        <input type="date" id="dateTo" title="To date">
        <button onclick="loadInspections(1)">Search</button>
      </div>
    </div>

    <!-- Export Buttons -->
    <div class="export-buttons">
      <a href="/api/export/csv">Export CSV</a>
      <a href="/api/export/excel">Export Excel</a>
    </div>

    <!-- Inspections Table -->
    <table class="inspections-table">
      <thead>
        <tr>
          <th>Capture ID</th>
          <th>Timestamp</th>
          <th>Result</th>
          <th>Confidence</th>
          <th>Notes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="inspectionsBody">
        <tr><td colspan="6" class="no-data">Loading...</td></tr>
      </tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    var currentPage = 1;
    var perPage = 20;

    async function loadInspections(page) {
      currentPage = page || 1;
      var search = document.getElementById('searchInput').value;
      var dateFrom = document.getElementById('dateFrom').value;
      var dateTo = document.getElementById('dateTo').value;

      var url = '/api/inspections?page=' + currentPage + '&per_page=' + perPage;
      if (search) url += '&search=' + encodeURIComponent(search);
      if (dateFrom) url += '&date_from=' + dateFrom;
      if (dateTo) url += '&date_to=' + dateTo;

      try {
        var resp = await fetch(url);
        var data = await resp.json();
        renderTable(data.items);
        renderPagination(data.total, data.page, data.per_page);
      } catch (e) {
        document.getElementById('inspectionsBody').innerHTML =
          '<tr><td colspan="6" class="no-data">Failed to load inspections</td></tr>';
      }
    }

    function renderTable(items) {
      var tbody = document.getElementById('inspectionsBody');
      if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="no-data">No inspections found</td></tr>';
        return;
      }
      tbody.innerHTML = items.map(function(item) {
        var notes = item.notes || '';
        return '<tr>' +
          '<td>' + (item.capture_id || '') + '</td>' +
          '<td>' + (item.timestamp ? new Date(item.timestamp).toLocaleString() : '') + '</td>' +
          '<td>' + (item.classification || '') + '</td>' +
          '<td>' + (item.confidence ? (item.confidence * 100).toFixed(1) + '%' : '') + '</td>' +
          '<td class="notes-cell" title="' + notes.replace(/"/g, '&quot;') + '">' + notes + '</td>' +
          '<td>' +
            '<a class="btn-pdf" href="/api/export/pdf/' + item.capture_id + '">PDF</a>' +
            '<button class="btn-delete" onclick="deleteInspection(\'' + item.capture_id + '\')">Delete</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    function renderPagination(total, page, perPage) {
      var totalPages = Math.ceil(total / perPage);
      var container = document.getElementById('pagination');
      if (totalPages <= 1) { container.innerHTML = ''; return; }

      var html = '';
      html += '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="loadInspections(' + (page - 1) + ')">Prev</button>';
      for (var i = 1; i <= Math.min(totalPages, 7); i++) {
        html += '<button class="' + (i === page ? 'active' : '') + '" onclick="loadInspections(' + i + ')">' + i + '</button>';
      }
      html += '<button ' + (page >= totalPages ? 'disabled' : '') + ' onclick="loadInspections(' + (page + 1) + ')">Next</button>';
      container.innerHTML = html;
    }

    async function deleteInspection(captureId) {
      if (!confirm('Are you sure you want to delete inspection ' + captureId + '?')) return;
      try {
        var resp = await fetch('/api/inspections/' + encodeURIComponent(captureId), {
          method: 'DELETE'
        });
        if (resp.ok) {
          loadInspections(currentPage);
        } else {
          alert('Failed to delete inspection');
        }
      } catch (e) {
        alert('Error deleting inspection');
      }
    }

    // Initial load
    loadInspections(1);
  </script>
</body>
</html>
