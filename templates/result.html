{% extends "base.html" %}
{% block title %}MatanglaWIN - Inspection Result{% endblock %}
{% block content %}
  <section class="panel result-panel">
    <div class="status-banner status-banner-lg {{ 'status-crack' if has_crack else 'status-ok' }}">
      {{ status }}
    </div>

    <dl class="meta-list meta-inline">
      <div><dt>Captured</dt><dd>{{ timestamp }}</dd></div>
      <div><dt>Source</dt><dd>{{ source_label }}</dd></div>
    </dl>

    <div class="result-images {{ 'single' if not has_crack else '' }}">
      <figure class="shot">
        <figcaption>Original photo</figcaption>
        <img src="{{ original_url }}" alt="Original photo" class="shot-img">
      </figure>
      {% if has_crack %}
      <figure class="shot">
        <figcaption>Red-highlighted</figcaption>
        <img src="{{ highlighted_url }}" alt="Crack highlighted photo" class="shot-img">
      </figure>
      {% endif %}
    </div>

    <div class="actions">
      <a href="{{ url_for('index') }}" class="btn-secondary">Back to dashboard</a>
      <a href="{{ url_for('inspections_page') }}" class="btn-primary">View inspection history</a>
    </div>
  </section>
{% endblock %}
